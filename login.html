<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jalyry Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>Jalyry</h1>

    <form id="login-form">

        <input 
            type="email" 
            id="email" 
            placeholder="Correo electrónico"
            required
        >

        <input 
            type="password" 
            id="password" 
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Iniciar Sesión
        </button>

    </form>

    <a href="admin-login.html" class="admin-link">
    ¿Eres administrador?
</a>

    <a href="register.html" class="admin-link">
    Registrarse
</a>
    <p id="message"></p>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
