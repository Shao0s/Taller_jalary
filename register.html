<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Jalyry</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>Crear Cuenta</h1>

    <form id="register-form">

        <input
            type="email"
            id="email"
            placeholder="Correo"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p id="message"></p>

</div>

<script type="module" src="js/register.js"></script>

</body>
</html>
