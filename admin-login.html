<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Jalyry</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>Administrador</h1>

    <form id="admin-login-form">

        <input
            type="email"
            id="admin-email"
            placeholder="Correo del administrador"
            required
        >

        <input
            type="password"
            id="admin-password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Entrar como Admin
        </button>

    </form>

    <a href="login.html" class="admin-link">
    ← Volver al login de clientes
</a>

    <p id="message"></p>

</div>

<script type="module" src="js/admin-login.js"></script>

</body>
</html>
