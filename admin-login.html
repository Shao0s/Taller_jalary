<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Jalyry</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <h1 class="welcome-title">
            Administrador
        </h1>

        <div class="line"></div>

        <!-- LOGO -->
        <div class="logo-container">

            <img 
                src="img/logo.png" 
                alt="Jalyry Logo"
                class="logo"
            >

        </div>

        <!-- FORM -->
        <form id="admin-login-form">

            <input
                type="email"
                id="admin-email"
                placeholder="Correo del administrador"
                required
            >

            <input
                type="password"
                id="admin-password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Entrar como Admin
            </button>

        </form>

        <!-- LINKS -->
        <div class="login-links">

            <a href="index.html">
                ← Volver al login de clientes
            </a>

        </div>

        <p id="message"></p>

    </div>

</div>

<script type="module" src="js/admin-login.js"></script>
<script type="module" src="js/seguridad.js"></script>
<script type="module" src="/js/logout.js"></script>

</body>
</html>
